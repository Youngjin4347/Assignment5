<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        window.addEventListener("load", function () {
            const fruit = document.querySelector("#fruit");
            const addbtn = document.querySelector("#addbtn");
            const list = document.querySelector("#list");


            addbtn.addEventListener("click", function () {
                let flist = fruit.value.split(",");
                for (let i = 0; i < flist.length; i++) {
                    let newLi = document.createElement("li");
                    newLi.textContent = flist[i];
                    list.appendChild(newLi);

                    let deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "삭제";
                    newLi.appendChild(deleteBtn);
                    deleteBtn.addEventListener("click", function () {
                        list.removeChild(newLi);
                    })
                }
            });
        })

    </script>
</head>


<body>

    <h1>과일 입력, 삭제 실습</h1>

    <input type="text" id="fruit" placeholder="과일을 입력하세요">
    <button id="addbtn">Add</button>
    <ul id="list"></ul>


    <!--클릭버튼 실습-->
    <h1>클릭버튼 실습</h1>
    <button id="clickBtn" onclick="clickMe()">Click Me </button>





    <!--계산기 실습-->
    <h1>덧셈 계산기</h1>

    <form>
        <input type="text" id="num1" name="num1" size="2" />
        <button type="button" id="add">+</button>
        <input type="text" id="num2" name="num2" size="2">
        =
        <input type="text" id="result" name="result" size="2" readonly>
        <br><br>
        <input type="reset" value="초기화">
    </form><br><br>


    <a href="index.html" class="btn btn-secondary">홈으로 가기</a>



</body>

</html>

<script>

    const addBtn = document.getElementById("add");

    addBtn.addEventListener("click", add);

    function add() {

        const num1 = document.querySelector("#num1");
        const num2 = document.querySelector("#num2");
        const result = parseFloat(num1.value) + parseFloat(num2.value);

        document.querySelector("#result").value = result;
    }

    function clickMe() {
        const btn = document.querySelector("#clickBtn");
        btn.innerText = "Clicked!";
        btn.style.color = "green";
        btn.style.backgroundColor = "yellow";
    }

</script>
