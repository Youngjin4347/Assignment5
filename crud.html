<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="my.css">

</head>

<body>
    <header>
        <nav class="navbar navbar-dark fixed-top bg-dark">
            <div class="container-fluid justify-content-between">

                <div class="d-flex align-items-center">
                    <img src="https://previews.123rf.com/images/siamimages/siamimages1612/siamimages161200561/67760057-book-icon-illustration-design.jpg"
                        class="logo" alt="Book Management">

                    <p class="navbar-brand mb-0 ms-2">Book Management</p>
                </div>

            </div>
        </nav>

        <div class="container pt-5">
            <h1>도서 관리 프로그램</h1>
            <p>도서 정보를 확인하고 관리할 수 있습니다.</p>
        </div>
    </header>

    <main class="container">
        <div class="mt-5">
            <h2>도서 정보 입력</h2>

            <form id="bookForm">

                <div class="mb-3">
                    <label for="bookId" class="form-label">
                        도서 ID
                    </label>
                    <input type="number" id="bookId" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label">
                        도서명
                    </label>
                    <input type="text" id="title" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="genre" class="form-label">
                        장르
                    </label>
                    <input type="text" id="genre" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label">
                        저자
                    </label>
                    <input type="text" id="author" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="publisher" class="form-label">
                        출판사
                    </label>
                    <input type="text" id="publisher" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label">
                        대여 상태
                    </label>

                    <select id="status" class="form-select">
                        <option value="대여 가능">
                            대여 가능
                        </option>
                        <option value="대여 중">
                            대여 중
                        </option>
                    </select>
                </div>

                <button type="button" id="saveBtn" class="btn btn-primary">
                    저장
                </button>
            </form>
        </div>

        <div class="mt-5">
            <h2>도서 목록</h2>
            <p>현재 등록된 도서 목록입니다.</p>
            <div id="bookList">
            </div>
        </div>
    </main>

    <footer>
        <p class="text-center text-body-secondary">
            Book Management System © 2026
        </p>
    </footer>

</body>

</html>
