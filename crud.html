<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="my.css">

    <script>
        let updateIndex = -1;
        let books = [
            {
                id: 228261,
                title: "해리포터와 마법사의 돌",
                genre: "판타지",
                author: "J.K. Rowling",
                publisher: "문학수첩",
                status: "대여 가능"
            },
            {
                id: 336282,
                title: "어린왕자",
                genre: "소설",
                author: "Antoine de Saint-Exupery",
                publisher: "열린책들",
                status: "대여 가능"
            },
            {
                id: 927272,
                title: "데미안",
                genre: "소설",
                author: "Hermann Hesse",
                publisher: "민음사",
                status: "대여 중"
            }
        ];

        function showBooks() {
            let bookList = document.querySelector("#bookList");

            bookList.innerHTML = "";

            for (let i = 0; i < books.length; i++) {
                let book = books[i];
                let li = document.createElement("li");

                li.innerText = book.id;
                li.innerText += " - " + book.title;
                li.innerText += " - " + book.author;
                li.innerText += " - " + book.genre;
                li.innerText += " - " + book.publisher;
                li.innerText += " - " + book.status;

                let deleteBtn = document.createElement("button");
                deleteBtn.className = "btn btn-danger btn-sm ms-2";
                deleteBtn.textContent = "삭제";

                deleteBtn.addEventListener("click", function () {
                    if (confirm("정말 삭제하시겠습니까?")) {
                        books.splice(i, 1);
                        showBooks();
                    }

                })

                let updateBtn = document.createElement("button");
                updateBtn.className = "btn btn-warning btn-sm ms-2";
                updateBtn.textContent = "수정";
                updateBtn.addEventListener("click", function () {
                    updateIndex = i;
                    document.querySelector("#bookId").value = book.id;
                    document.querySelector("#title").value = book.title;
                    document.querySelector("#genre").value = book.genre;
                    document.querySelector("#author").value = book.author;
                    document.querySelector("#publisher").value = book.publisher;
                    document.querySelector("#status").value = book.status;

                });

                li.appendChild(updateBtn);
                li.appendChild(deleteBtn);
                bookList.appendChild(li);

            };
        }

        window.onload = function () {
            showBooks();
            let addBtn = document.querySelector("#addBtn");

            addBtn.addEventListener("click", function () {

                let bookId = document.querySelector("#bookId").value;
                let title = document.querySelector("#title").value;
                let genre = document.querySelector("#genre").value;
                let author = document.querySelector("#author").value;
                let publisher = document.querySelector("#publisher").value;
                let status = document.querySelector("#status").value;

                if (!bookId || !title || !genre || !publisher) {
                    alert("도서 ID, 도서명, 장르, 출판사는 필수 입력 항목입니다.");
                    return;
                }

                if (bookId.length != 6 || isNaN(bookId)) {
                    alert("도서 ID는 6자리 숫자로 입력해주세요.");
                    return;
                }

                if (updateIndex == -1) {

                    if (books.some(book => book.id === parseInt(bookId))) {
                        alert("이미 존재하는 도서 ID입니다. 다른 ID를 입력해주세요.");
                        return;
                    }

                    books.push({
                        id: parseInt(bookId),
                        title: title,
                        genre: genre,
                        author: author,
                        publisher: publisher,
                        status: status
                    });
                }

                else {
                    books[updateIndex].id = parseInt(bookId);
                    books[updateIndex].title = title;
                    books[updateIndex].genre = genre;
                    books[updateIndex].author = author;
                    books[updateIndex].publisher = publisher;
                    books[updateIndex].status = status;

                    updateIndex = -1;
                }

                showBooks();
                document.querySelector("#bookForm").reset();
            })
        };



    </script>

</head>

<body>
    <header class="navbar navbar-dark bg-dark">
        <div class="container-fluid justify-content-between">

            <div class="d-flex align-items-center">
                <img src="https://previews.123rf.com/images/siamimages/siamimages1612/siamimages161200561/67760057-book-icon-illustration-design.jpg"
                    class="logo" alt="Book Management">

                <p class="navbar-brand mb-0 ms-2">Book Management</p>
            </div>

        </div>
    </header>

    <main class="container">

        <div class="container pt-5">
            <h1>도서 관리 프로그램</h1>
            <p>도서 정보를 확인하고 관리할 수 있습니다.</p>
        </div>

        <div class="mt-5">
            <h2>도서 정보 입력</h2>

            <form id="bookForm">

                <div class="mb-3">
                    <label for="bookId" class="form-label">
                        도서 ID
                    </label>
                    <input type="text" id="bookId" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label">
                        도서명
                    </label>
                    <input type="text" id="title" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="genre" class="form-label">
                        장르
                    </label>
                    <input type="text" id="genre" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label">
                        저자
                    </label>
                    <input type="text" id="author" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="publisher" class="form-label">
                        출판사
                    </label>
                    <input type="text" id="publisher" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label">
                        대여 상태
                    </label>

                    <select id="status" class="form-select">
                        <option value="대여 가능">
                            대여 가능
                        </option>
                        <option value="대여 중">
                            대여 중
                        </option>
                    </select>
                </div>

                <button type="button" id="addBtn" class="btn btn-primary">
                    저장
                </button>
            </form>
        </div>

        <div class="mt-5">
            <h2>도서 목록</h2>
            <p>현재 등록된 도서 목록입니다.</p>
            <ul id="bookList">
            </ul>
        </div>
        <a href="index.html" class="btn btn-secondary">홈으로 가기</a>

    </main>

    <footer>
        <p class="text-center text-body-secondary">
            Book Management System © 2026
        </p>
    </footer>

</body>

</html>
