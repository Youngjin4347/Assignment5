<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function clickMe() {
            const btn = document.querySelector("#clickBtn");
            btn.innerText = "Clicked!";
            btn.style.color = "green";
            btn.style.backgroundColor = "yellow";
        }

    </script>
</head>

<body>
    <!--클릭버튼 실습-->
    <button id="clickBtn" onclick="clickMe()">Click Me </button>





    <!--계산기 실습-->
    <h1>덧셈 계산기</h1>

    <form>
        <input type="text" id="num1" name="num1" size="2" />
        <button type="button"  id="add">+</button>
        <input type="text" id="num2" name="num2" size="2">
        =
        <input type="text" id="result" name="result" size="2" readonly>
        <br><br>
        <input type="reset" value="초기화">
    </form>


</body>

</html>

<script>
    const addBtn = document.getElementById("add");

    addBtn.addEventListener("click", add);

    function add() {

        const num1 = document.querySelector("#num1");
        const num2 = document.querySelector("#num2");
        const result = parseFloat(num1.value) + parseFloat(num2.value);

        document.querySelector("#result").value = result;
    }
</script>
